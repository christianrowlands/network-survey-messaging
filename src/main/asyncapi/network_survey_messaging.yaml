    version:
      type: string
      description: >-
        The version number of the Network Survey Messaging API that this message is based off of.
      example: 2.6.0
    deviceSerialNumber:
      type: string
      description: >-
        The unique identifier for the device that captured this record. This should be consistent and should never change.
      example: '1234'
    deviceName:
      type: string
      description: >-
        A human readable name assigned to the device that captured this record. This value can change and is typically used as a human friendly display name.
      example: Craxiom Pixel
    deviceTime:
      type: string
      format: date-time
      description: >-
        The timestamp of when this message was created in milliseconds formatted as an [RFC3339 date-time](https://xml2rfc.tools.ietf.org/public/rfc/html/rfc3339.html#anchor14). For example, `'1996-12-19T16:39:57-08:00'`.
      example: '1996-12-19T16:39:57-08:00'
    latitude:
      type: number
      format: double
      description: The latitude representing where this survey record was recorded.
      example: 51.470334
    longitude:
      type: number
      format: double
      description: The longitude representing where this survey record was recorded.
      example: -0.486594
    altitude:
      type: number
      format: float
      description: >-
        The altitude in meters above MSL representing where this survey record was recorded.
      example: 13.3
    speed:
      type: number
      format: float
      minimum: 0
      description: >-
        The speed at the time of this record capture in meters per second. This field was added in version 0.11.0. From the Network Survey Android app, this field is only present if it is detected that the device is in motion.
      example: 9.3
    missionId:
      type: string
      description: >-
        A unique name for this particular run of a survey. The timestamp of when the survey was started is typically included, or the mission ID might contain a user entered value to enable them to uniquely identify the purpose of this survey.
      example: Survey1 20200724-154325
    recordNumber:
      type: integer
      format: int32
      minimum: 1
      description: >-
        Starts at 1 and each subsequent record should have its number incremented by 1.
    groupNumber:
      type: integer
      format: int32
      minimum: 1
      description: >-
        Starts at 1 and each subsequent scan should have its number incremented by 1. For simple frequency sweeps, all detections in the same sweep should have the same group number. For cellular surveys, each scan of the serving cell and neighbor cells should have the same group number.
    signalStrength:
      type: number
      format: float
      minimum: -200
      maximum: 200
      description: The signal strength of the received signal in dBm.
      example: -73.1
    deviceModel:
      type: string
      description: The model number of the device that this message originated from.
      example: Pixel 5
    appVersion:
      type: string
      description: The version of the software application that this message originated from (most likely the Network Survey Android app, but could be any other app). Added in version 1.3.0.
      example: 1.28
    accuracy:
      type: integer
      format: int32
      minimum: 0
      description: >-
        The estimated horizontal accuracy of the provided location, radial, in meters. We define horizontal accuracy as the radius of 68% confidence. In other words, if you draw a circle centered at this location's latitude and longitude, and with a radius equal to the accuracy, then there is a 68% probability that the true location is inside the circle. A value of 0 indicates there was no available horizontal accuracy.
      example: 40
    locationAge:
      type: integer
      format: int32
      minimum: 0
      description: >-
        The age of the location fix in milliseconds. This field is optional and if it is not present that is an indication that the age of the location fix is unknown. Added in version 1.7.0.
      example: 1000
    provider:
      type: string
      description: The company providing the cellular service.
      example: Verizon
    mcc:
      type: integer
      format: int32
      minimum: 0
      description: 'Deprecated: Use plmn instead. Mobile Country Code, 3 digits.'
      example: 311
    mnc:
      type: integer
      format: int32
      minimum: 0
      description: >-
        Deprecated: Use plmn instead. Mobile Network Code, used in conjunction with MCC (PLMN) to identify a carrier, 2 to 3 digits. Note: leading zeros are lost when represented as an integer.
      example: 480
    plmn:
      type: string
      description: >-
        PLMN identifier in "MCC-MNC" format. MCC is always 3 digits. MNC is 2 or 3 digits with leading zeros preserved (e.g., "310-01", "311-480"). Consumers should prefer this field over the separate integer mcc/mnc fields, which cannot preserve MNC leading zeros. Added in version 2.3.0.
      example: '311-480'
    servingCell:
      type: boolean
      description: >-
        Boolean indicating if this record represents a serving cell record, or a neighbor cell record.  If the field is unset then it is unknown if this record is for the serving cell or a neighbor cell. A value of true indicates that the record represents a serving cell, a value of false indicates a neighbor record. Note that a cell the device is actively connected to as a secondary cell (e.g. the 5G NSA data leg) reports false here because the device is not registered on it; a connectionStatus of SECONDARY_SERVING identifies those cells when the device reports it, but not all devices report a connection status.
    connectionStatus:
      type: string
      description: >-
        The connection the device has to the cell this record represents, as reported by Android's [CellInfo.getCellConnectionStatus()](https://developer.android.com/reference/android/telephony/CellInfo#getCellConnectionStatus()), which was added in API level 28. PRIMARY_SERVING is the cell the device is registered on; for a 5G NSA (EN-DC) connection this is the LTE anchor cell. SECONDARY_SERVING is a cell the device is actively connected to as a secondary cell. NEIGHBOR is a cell that was measured but not connected to.


        Presence: the underlying protobuf enum's zero value (UNKNOWN) is never serialized, so an absent field and an explicit UNKNOWN are indistinguishable on the wire. Consumers MUST treat absent, UNKNOWN, and an empty string as identical, all meaning the device did not report a status, and MUST NOT infer from a reported value on one cell that the device reports the status for all cells.


        Trust: a value of SECONDARY_SERVING is authoritative when present, since the device is asserting an active secondary connection. The ABSENCE of SECONDARY_SERVING proves nothing, because many devices report UNKNOWN or NEIGHBOR for every cell. The servingCell field remains the primary serving-versus-neighbor discriminator; connectionStatus is a refinement layered on top of it, not a replacement. The two fields come from independent device APIs and may disagree; where they do, servingCell is authoritative for registration and connectionStatus is authoritative only for its positive SECONDARY_SERVING assertion. A SECONDARY_SERVING cell has servingCell set to false.


        Classifying a secondary cell: a SECONDARY_SERVING cell whose scan group's PRIMARY_SERVING cell is the SAME radio technology is a carrier aggregation secondary component carrier (SCell); where the group's primary serving cell is a DIFFERENT radio technology it is a dual connectivity secondary leg. For example, a SECONDARY_SERVING NR record in a group whose primary serving cell is LTE is the 5G NSA (EN-DC) data leg. A scan group is identified by (deviceSerialNumber, missionId, groupNumber); records from different SIM slots never share a group number. When a group contains no PRIMARY_SERVING record, a secondary cell in it cannot be classified by this field alone.


        Practical note: shipping Android devices do not expose LTE secondary component carriers as separate entries in getAllCellInfo(), so SECONDARY_SERVING is rare on an LTE record and MUST NOT be used as a carrier aggregation indicator. Use cellBandwidthsKhz for carrier aggregation.


        This enum may gain values in future versions, and protobuf JSON serializes an unrecognized enum value as an integer rather than a name, so consumers must tolerate both. Added in version 2.5.0.
      enum:
        - UNKNOWN
        - PRIMARY_SERVING
        - SECONDARY_SERVING
        - NEIGHBOR
      example: PRIMARY_SERVING
    cellBandwidthsKhz:
      type: array
      items:
        type: integer
        format: int32
      description: >-
        The per-carrier channel bandwidths, in kHz, of the device's cellular data connection at the time of the scan, as reported by Android's [ServiceState.getCellBandwidths()](https://developer.android.com/reference/android/telephony/ServiceState#getCellBandwidths()), which was added in API level 28. One entry per aggregated component carrier, so two or more entries means carrier aggregation was active and the sum of the entries is the aggregate downlink bandwidth.


        This is a property of the device's connection at the time of the scan rather than of the individual cell this record represents. It is populated on the records for the cells the device was actively using in that scan (servingCell true, or connectionStatus SECONDARY_SERVING) and is omitted on neighbor records. The producer filters out the platform's 0 and unavailable sentinel values before publishing, so every entry is a valid bandwidth.


        Reliability is asymmetric: two or more entries proves carrier aggregation was active, but zero or one entry does NOT prove it was inactive, because some devices report an empty array or only the primary cell's bandwidth while aggregating. An absent or empty array means the device did not report bandwidths and must not be interpreted as no carrier aggregation. Added in version 2.5.0.
      example: [20000, 10000]
    slot:
      type: integer
      description: >-
        The slot number of the SIM card or radio slot that this record was captured from. This enables support for multiple SIM cards in a single device or multiple radios in a single device. Numbering does not start at 0 or 1, and can be any arbitrary number. Therefore, the number does not reveal anything about the number of SIM cards or radio slots in the device. This field is optional, and if it is not present that is an indication that the device only has a single SIM card or radio (but the presence of this field does not indicate multiple SIM cards or radios). Added in version 0.15.0.
      example: 2
