/**
 * Defines the Change Type values used in the Watchlist Entry Update message.
 *
 * This protobuf definition is provided as a convenience only. See the official API documentation for the true field
 * schema.
 *
 * It is necessary to define this enum in an individual file so that duplicate enum values can be used. This file
 * specifies a different protobuf package than other enums so that the enum value scope is different than all other
 * enums.
 */
syntax = "proto3";

package com.craxiom.messaging.watchlist.changetype;

option java_multiple_files = true;
option java_package = "com.craxiom.messaging.watchlist";
option go_package = "craxiom.com/messaging";

/**
 * Describes the kind of Watchlist Entry Update message.
 *
 * Every message published in this version of the API is a SNAPSHOT: it carries the full authoritative list of
 * entries for the device (published when the device connects to the broker and whenever the watchlist changes).
 * A cleared watchlist is a SNAPSHOT with an empty entries list. Consumers MUST ignore messages with an
 * unrecognized change type so that incremental change types can be added in a future release without breaking
 * existing consumers.
 */
enum WatchlistChangeType {
    UNKNOWN = 0;
    SNAPSHOT = 1;
}
