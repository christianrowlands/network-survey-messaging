/**
 * Defines the Match Type values used in the Watchlist messages.
 *
 * This protobuf definition is provided as a convenience only. See the official API documentation for the true field
 * schema.
 *
 * It is necessary to define this enum in an individual file so that duplicate enum values can be used. This file
 * specifies a different protobuf package than other enums so that the enum value scope is different than all other
 * enums.
 */
syntax = "proto3";

package com.craxiom.messaging.watchlist.matchtype;

option java_multiple_files = true;
option java_package = "com.craxiom.messaging.watchlist";
option go_package = "craxiom.com/messaging";

/**
 * How a watchlist entry's SSID/BSSID criteria are compared against observed networks. EXACT is a case-insensitive
 * equality match and is the only type supported today; additional types (for example CONTAINS or PREFIX) may be added
 * in the future.
 */
enum WatchlistMatchType {
    UNKNOWN = 0;
    EXACT = 1;
}
