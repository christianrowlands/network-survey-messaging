              $ref: '#/components/schemas/latitude'
            longitude:
              $ref: '#/components/schemas/longitude'
            altitude:
              $ref: '#/components/schemas/altitude'
            speed:
              $ref: '#/components/schemas/speed'
            missionId:
              $ref: '#/components/schemas/missionId'
            recordNumber:
              $ref: '#/components/schemas/recordNumber'
            accuracy:
              $ref: '#/components/schemas/accuracy'
            locationAge:
              $ref: '#/components/schemas/locationAge'
            sourceAddress:
              $ref: '#/components/schemas/sourceAddress'
              example: '56:14:62:0D:98:01'
            destinationAddress:
              $ref: '#/components/schemas/destinationAddress'
            signalStrength:
              $ref: '#/components/schemas/signalStrength'
            txPower:
              $ref: '#/components/schemas/txPower'
            technology:
              $ref: '#/components/schemas/technology'
            supportedTechnologies:
              $ref: '#/components/schemas/supportedTechnologies'
            otaDeviceName:
              $ref: '#/components/schemas/otaDeviceName'
            channel:
              type: integer
              format: int32
              minimum: 0
              maximum: 78
              description: >-
                The channel on which this frame was recorded. See the BLUETOOTH SPECIFICATION Version 5.0 | Vol 2, Part A Section 2 (page 325) for more details.
              example: 2
            addressType:
              type: string
              description: >-
                The Bluetooth address type as reported by Android's BluetoothDevice.getAddressType() (https://developer.android.com/reference/android/bluetooth/BluetoothDevice#getAddressType()), which was added in API level 35 (Android 15). On older Android versions the value is UNKNOWN. PUBLIC is typically reported for Bluetooth Classic (BR/EDR) devices and for LE devices using an IEEE-assigned public address. Note that BR/EDR has no public/random distinction at the protocol level, so a PUBLIC value alone does not imply the address is trackable. RANDOM (resolvable private, non-resolvable private, or random static; the Android API does not expose the subtype) and ANONYMOUS apply only to Bluetooth LE. Added in version 1.8.0.
              enum:
                - UNKNOWN
                - PUBLIC
                - RANDOM
                - ANONYMOUS
            deviceClass:
              type: string
              description: >-
                The major and minor Bluetooth device class. The format of this field is hexadecimal, 4 bytes, with leading zeros removed. The first 2 bytes are the major device class and the last 2 bytes are the minor device class. Added in version 1.8.0.
              example: '41C'
            serviceUuids:
              type: array
              description: >-
                A list of service UUIDs within the advertisement that are used to identify the bluetooth GATT services. Added in version 1.8.0.
              example:
                - 0000fe07-0000-1000-8000-00805f9b34fb
              items:
                type: string
                format: uuid
            companyId:
              type: string
              description: >-
                The company ID of the manufacturer of the device. The format is hexadecimal, 4 bytes, with leading zeros removed. Values are defined here: https://www.bluetooth.com/specifications/assigned-numbers/ . Added in version 1.8.0.
              example: '4C'
            mfgData:
              type: string
              description: >-
                The raw manufacturer specific data (advertisement type 0xFF) as a hex string. This includes the full manufacturer specific data payload including the company ID prefix (first 2 bytes in little endian order). Added in version 1.9.0.
              example: '4C0012020003'
